name: release

on:
  push:
    tags:
      # GitHub tag filters are globs, not regular expressions. validate-tag
      # enforces exact vX.Y.Z; any other v* tag is skipped.
      - 'v*'

# Minimum permissions by default; contents: write only on the job that publishes.
permissions: {}

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.tag.outputs.valid }}
    steps:
      - id: tag
        name: Validate release tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            echo "Skipping release: ${GITHUB_REF_NAME} is not a vX.Y.Z tag."
          fi

  release:
    needs: validate-tag
    if: needs.validate-tag.outputs.valid == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # go.mod is the single source of the Go toolchain version.
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Build release artifacts
        # VERSION overrides the Makefile stamp and injects the tag via -ldflags, with -trimpath.
        run: make build-all VERSION="${GITHUB_REF_NAME}"
      - name: Verify artifacts exist
        shell: bash
        run: |
          if ! compgen -G "bin/daedalus-*" > /dev/null; then
            echo "No bin/daedalus-* artifact was generated; does cmd/daedalus exist and did build-all package the command?" >&2
            exit 1
          fi
      - name: Generate checksums
        # Checksum paths are relative to bin/ so sha256sum -c works in a flat download folder.
        shell: bash
        run: (cd bin && sha256sum daedalus-* > CHECKSUMS.txt)
      - name: Verify checksums from a flat directory
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp bin/daedalus-* bin/CHECKSUMS.txt "$tmp/"
          (cd "$tmp" && sha256sum -c CHECKSUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" bin/daedalus-* bin/CHECKSUMS.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" bin/daedalus-* bin/CHECKSUMS.txt \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
