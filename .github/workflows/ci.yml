name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # go.mod is the single source of the Go toolchain version.
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to the Makefile floor (GOLANGCI_LINT_MIN) so local and CI fail the same findings.
          version: v2.14.0
          install-mode: binary
      - name: Verify generated bindings
        # A pathspec with no match makes git diff --exit-code exit 0, so internal/gen must exist and be tracked.
        run: |
          make generate
          git diff --exit-code -- internal/gen
      - name: Buf lint and breaking checks
        run: |
          buf lint
          # Compares against the remote-tracking ref of the default branch,
          # never a local branch: detached checkouts (tags, some
          # pull_request contexts) may not have it. The explicit fetch
          # creates the ref instead of assuming the checkout did.
          git fetch --no-tags origin "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
          buf breaking --against ".git#ref=refs/remotes/origin/${{ github.event.repository.default_branch }}"
      - name: Test with race detector
        run: go test -race ./...
      - name: Lint
        run: golangci-lint run ./...
      - name: Build
        run: go build ./...
      - name: Record benchmarks
        run: make bench | tee bench.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.sha }}
          path: bench.txt
          retention-days: 30

  determinism:
    # The full suite, including the committed goldens, must pass on native amd64 and arm64.
    # Do not add if: or continue-on-error: a missing runner stays queued, and timeout-minutes does not cover that wait.
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is amd64; ubuntu-24.04-arm is native arm64.
        # Not QEMU, not docker buildx --platform.
        runs-on: [ubuntu-latest, ubuntu-24.04-arm]
    name: determinism (${{ matrix.runs-on }})
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Require the native architecture for this matrix leg
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "${{ matrix.runs-on }}" in
            ubuntu-24.04-arm)
              expected="aarch64"
              ;;
            ubuntu-latest)
              expected="x86_64"
              ;;
            *)
              echo "::error::determinism matrix entry '${{ matrix.runs-on }}' is not a native runner this gate knows (ubuntu-latest or ubuntu-24.04-arm)"
              exit 1
              ;;
          esac
          if [ "$arch" != "$expected" ]; then
            echo "::error::${{ matrix.runs-on }} reported ${arch}, expected native ${expected}. QEMU and docker buildx --platform do not prove architecture determinism."
            exit 1
          fi
          if [ -r /proc/self/maps ] && grep -E -q 'qemu-' /proc/self/maps; then
            echo "::error::This process is running under QEMU user-mode emulation. Emulation does not prove architecture determinism."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run full suite (golden determinism gate)
        # -count=1 disables the test cache: the gate must actually run the
        # golden on each architecture, never inherit a result.
        run: go test -count=1 ./...
