name: ci

on:
  push:
    # Branches only. A tag is a snapshot of a main branch that was already
    # verified, and the release workflow reruns the tests with -race before
    # publishing, so running CI on a tag duplicates work. Tag builds also
    # lack the branch context this workflow assumes (detached HEAD, with no
    # local branch refs) — that is what broke Geppetto's CI on a tag push.
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # Single source of the Go toolchain version: go.mod.
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@v1
      - uses: golangci/golangci-lint-action@v7
        with:
          # Pinned to the same version the Makefile requires as the floor
          # (GOLANGCI_LINT_MIN), so that local and CI fail the same set of
          # findings.
          version: v2.14.0
          install-mode: binary
      - name: Verify generated bindings
        # The pathspec points at internal/gen, where the generated bindings
        # are committed. A pathspec with no match exits 0 in silence (that
        # was Geppetto's false green); here the directory exists and has
        # tracked files, so the diff actually checks something.
        run: |
          make generate
          git diff --exit-code -- internal/gen
      - name: Buf lint and breaking checks
        run: |
          buf lint
          # Compares against the remote-tracking ref of the default branch,
          # never a local branch: detached checkouts (tags, some
          # pull_request contexts) may not have it. The explicit fetch
          # creates the ref instead of assuming the checkout did.
          git fetch --no-tags origin "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
          buf breaking --against ".git#ref=refs/remotes/origin/${{ github.event.repository.default_branch }}"
      - name: Test with race detector
        # The root suite includes import purity and the frozen goldens
        # (specification section 13).
        run: go test -race ./...
      - name: Lint
        run: golangci-lint run ./...
      - name: Build
        run: go build ./...
      - name: Record benchmarks
        # Specification sections 11 and 13: records timings and allocations
        # of the three loads without turning the SLA budget into an
        # assertion on a shared runner.
        run: make bench | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: bench.txt
          retention-days: 30

  determinism:
    # AC-18 / P45: the same suite — including the goldens, with the SAME
    # committed expected file — passes on NATIVE amd64 and arm64 runners.
    # Emulation (QEMU) does not prove architecture determinism, which is why
    # the matrix uses ubuntu-24.04-arm, the native arm64 runner GitHub
    # offers for a public repository. Any Layout divergence fails the job
    # on the architecture that diverged.
    #
    # The specification does not fix a naming pattern for the golden tests,
    # so the selector is the whole suite (go test ./...): the goldens live
    # in the root tests (specification section 2) and are covered without
    # inventing a name.
    #
    # NOT EXERCISED locally: availability of the ubuntu-24.04-arm runner can
    # only be confirmed with the repository on GitHub. There is no remote,
    # so this job has never been scheduled. Do not skip the leg: no `if`,
    # no `continue-on-error`. A runs-on label with no matching runner stays
    # queued; the documented queue limit is 24 hours, and timeout-minutes
    # covers execution only, not that wait, so this file cannot turn a
    # missing runner into an immediate failure. The first step is what it
    # can enforce once a machine accepts the job: wrong uname or QEMU
    # user-mode fails before the suite can pass under emulation.
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is amd64; ubuntu-24.04-arm is native arm64.
        # Not QEMU, not docker buildx --platform.
        runs-on: [ubuntu-latest, ubuntu-24.04-arm]
    name: determinism (${{ matrix.runs-on }})
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Require the native architecture for this matrix leg
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "${{ matrix.runs-on }}" in
            ubuntu-24.04-arm)
              expected="aarch64"
              ;;
            ubuntu-latest)
              expected="x86_64"
              ;;
            *)
              echo "::error::determinism matrix entry '${{ matrix.runs-on }}' is not a native runner this gate knows (ubuntu-latest or ubuntu-24.04-arm)"
              exit 1
              ;;
          esac
          if [ "$arch" != "$expected" ]; then
            echo "::error::${{ matrix.runs-on }} reported ${arch}, expected native ${expected}. QEMU and docker buildx --platform do not prove AC-18 or AC-25."
            exit 1
          fi
          if [ -r /proc/self/maps ] && grep -E -q 'qemu-' /proc/self/maps; then
            echo "::error::This process is running under QEMU user-mode emulation. Emulation does not prove architecture determinism (specification section 13, P45)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run full suite (golden determinism gate)
        # -count=1 disables the test cache: the gate must actually run the
        # golden on each architecture, never inherit a result.
        run: go test -count=1 ./...
