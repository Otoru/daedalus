<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Daedalus — Map generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <h1>Daedalus</h1>
      <p class="local-note">Local same-origin execution · No data is persisted</p>
    </div>
    <div class="status-slot">
      <output id="status" class="status" aria-live="polite">Ready to generate</output>
    </div>
    <button id="generate" class="button primary" type="button">
      <span>Generate map</span>
    </button>
    <button id="request-trigger" class="button secondary" type="button" aria-expanded="false" aria-controls="request-pane">Complete ProtoJSON</button>
    <button id="response-trigger" class="button secondary" type="button" aria-expanded="false" aria-controls="response-pane">Returned ProtoJSON</button>
    <div class="legend" aria-label="Map legend">
      <span><i class="swatch empty"></i>Empty</span>
      <span><i class="swatch room"></i>Room</span>
      <span><i class="swatch corridor"></i>Corridor</span>
      <span><i class="swatch door"></i>Door</span>
    </div>
    <div class="zoom-controls">
      <label for="zoom">Scale</label>
      <input id="zoom" type="range" min="2" max="24" value="8">
      <output id="zoom-value" for="zoom">8 px</output>
      <button id="fit-map" class="button secondary compact" type="button">Fit</button>
    </div>
  </header>

  <main class="stage">
    <section class="map-panel" aria-labelledby="map-title">
      <h2 id="map-title" class="visually-hidden">Interactive map</h2>
      <div id="map-viewport" class="map-viewport">
        <canvas id="map-canvas" class="map-canvas" tabindex="0" aria-label="Generated map. Click a cell to inspect it."></canvas>
        <p id="map-placeholder" class="map-placeholder">Generate a map to view its cells, rooms, corridors and doors.</p>
        <aside id="cell-inspector" class="inspector" aria-labelledby="inspector-title" hidden>
          <h3 id="inspector-title">Selected cell</h3>
          <pre id="cell-details">No cell selected.</pre>
        </aside>
      </div>
    </section>

    <div id="json-drawer" class="drawer" hidden>
      <section id="request-pane" class="panel drawer-pane" aria-labelledby="request-title" tabindex="-1" hidden>
        <div class="panel-header">
          <h2 id="request-title">Complete ProtoJSON</h2>
          <div class="actions">
            <button id="load-example" class="button secondary" type="button">Load example</button>
            <button id="copy-request" class="button secondary" type="button">Copy request</button>
          </div>
        </div>
        <label class="visually-hidden" for="request-editor">GenerateRequest in ProtoJSON</label>
        <textarea id="request-editor" class="code-editor" spellcheck="false" autocomplete="off"></textarea>
      </section>

      <section id="response-pane" class="panel drawer-pane" aria-labelledby="response-title" tabindex="-1" hidden>
        <div class="panel-header">
          <h2 id="response-title">Returned ProtoJSON</h2>
          <button id="copy-response" class="button secondary" type="button" disabled>Copy response</button>
        </div>
        <div id="error-box" class="error-box" role="alert" hidden></div>
        <pre id="response-viewer" class="response-viewer">The response will appear here.</pre>
      </section>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
