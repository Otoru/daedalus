syntax = "proto3";

package daedalus.v1;

option go_package = "github.com/Otoru/daedalus/internal/gen/go/daedalus/v1;daedalusv1";

// DaedalusService is the dungeon-generation subprocess. It holds no state
// between requests: each Generate receives a complete Config, creates a
// Layout, returns it and retains neither the Layout, the Seed nor the random
// stream. The transport uses only the built-in algorithms
// (poisson_disk_rooms_v1 and prim_rooms_v1); algorithms injected by the game
// exist only in the SDK.
service DaedalusService {
  // Generate creates a complete Layout from a Config. Validation failures
  // return InvalidArgument, exceeded product limits return ResourceExhausted,
  // expiry returns DeadlineExceeded and caller cancellation returns Canceled.
  // It never returns a partial Layout.
  rpc Generate(GenerateRequest) returns (GenerateResponse);
  // GeneratePlatform creates a platform Plane and its directed jump graph.
  // Generate remains the dungeon API; Config was deliberately not changed
  // into a oneof so its established proto3 presence semantics stay intact.
  rpc GeneratePlatform(GeneratePlatformRequest) returns (GeneratePlatformResponse);
  // ComputeSteps answers, for each position, the next cardinal step toward
  // the nearest goal of that query. The service stores nothing: the grid
  // travels on every call and no field survives the response.
  rpc ComputeSteps(ComputeStepsRequest) returns (ComputeStepsResponse);
  // ComputeVisibility answers one visibility bitset per query. The service
  // stores nothing: the grid travels on every call and no field survives
  // the response. A malformed grid returns InvalidArgument; a count or
  // dimension past the ceiling returns ResourceExhausted.
  rpc ComputeVisibility(ComputeVisibilityRequest) returns (ComputeVisibilityResponse);
  // BuildGatingPlan computes a detached progression overlay for a complete Layout.
  rpc BuildGatingPlan(BuildGatingPlanRequest) returns (BuildGatingPlanResponse);
}

// GenerateRequest carries every Config datum, including extra_edge_count,
// room_role_requests, density_regions, room_geometry and corridor_geometry.
message GenerateRequest {
  Config config = 1;
}

// GenerateResponse carries the complete Layout that was generated successfully.
message GenerateResponse {
  Layout layout = 1;
}

// GeneratePlatformRequest is separate from GenerateRequest because platform
// generation has movement and certification semantics that dungeon Config has
// never had.
message GeneratePlatformRequest {
  PlatformConfig config = 1;
}

message GeneratePlatformResponse {
  PlatformLayout layout = 1;
}

// PlatformConfig carries the plane envelope. The platform generator validates
// the movement profile and rhythm vocabulary; these fields are intentionally
// not added to Config, whose meaning is frozen for existing dungeon clients.
message PlatformConfig {
  uint64 seed = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 max_rooms = 4;
  repeated PlatformBeatDefinition beat_definitions = 5;
  PlatformBeatDistribution spine = 6;
  optional PlatformBeatDistribution branches = 7;
}

message PlatformBeatDefinition {
  uint32 kind = 1;
  uint32 min_cells = 2;
  uint32 max_cells = 3;
  uint32 difficulty = 4;
  uint32 requires = 5;
}

message PlatformBeatWeight {
  uint32 kind = 1;
  uint32 weight = 2;
}

message PlatformBeatDistribution {
  repeated PlatformBeatWeight beats = 1;
  uint32 min_run_beats = 2;
  uint32 max_run_beats = 3;
}

// PlatformCellKind is disjoint from dungeon CellKind. In particular, zero is
// an invalid wire value here: an unrecognised value must be rejected rather
// than silently treated as air.
enum PlatformCellKind {
  PLATFORM_CELL_KIND_UNSPECIFIED = 0;
  PLATFORM_CELL_KIND_EMPTY = 1;
  PLATFORM_CELL_KIND_SOLID = 2;
  PLATFORM_CELL_KIND_SEMI_SOLID = 3;
  PLATFORM_CELL_KIND_CLIMBABLE = 4;
  PLATFORM_CELL_KIND_HAZARD = 5;
}

enum PlatformVerdict {
  PLATFORM_VERDICT_UNKNOWN = 0;
  PLATFORM_VERDICT_CERTIFIED = 1;
  PLATFORM_VERDICT_REJECTED = 2;
}

enum PlatformVerdictReason {
  PLATFORM_VERDICT_REASON_UNSPECIFIED = 0;
  PLATFORM_VERDICT_REASON_WITNESS_FOUND = 1;
  PLATFORM_VERDICT_REASON_TRIVIAL = 2;
  PLATFORM_VERDICT_REASON_OUT_OF_ENVELOPE = 3;
  PLATFORM_VERDICT_REASON_OBSTRUCTED = 4;
  PLATFORM_VERDICT_REASON_LANDING_UNSUPPORTED = 5;
  PLATFORM_VERDICT_REASON_RESOURCE_EXHAUSTED = 6;
  PLATFORM_VERDICT_REASON_ABILITY_MISSING = 7;
  PLATFORM_VERDICT_REASON_DISCONNECTED = 8;
  PLATFORM_VERDICT_REASON_BUDGET_EXHAUSTED = 9;
  PLATFORM_VERDICT_REASON_UNSUPPORTED_MOVESET = 10;
  PLATFORM_VERDICT_REASON_UNSUPPORTED_GEOMETRY = 11;
  PLATFORM_VERDICT_REASON_NOT_IMPLEMENTED = 12;
}

message PlatformBudgetReport {
  uint64 candidate_edges = 1;
  uint64 expanded_nodes = 2;
  uint64 collision_tests = 3;
  bool exhausted = 4;
}

// PlatformJudgement carries the three-valued result and its structured reason.
// Unknown is a result, never a successful certificate.
message PlatformJudgement {
  PlatformVerdict verdict = 1;
  PlatformVerdictReason reason = 2;
  string detail = 3;
  string model = 4;
  string profile_version = 5;
  PlatformBudgetReport budget = 6;
}

message PlatformGrid {
  uint32 width = 1;
  uint32 height = 2;
  repeated PlatformCellKind cells = 3;
}

message PlatformRoom {
  uint32 id = 1;
  Cell origin = 2;
  PlatformGrid grid = 3;
}

// PlatformJumpGraph is directed. Edges are navigation facts, not cardinal
// steps; clients must not feed them into ComputeSteps.
message PlatformJumpGraph {
  string model = 1;
  string profile_version = 2;
  uint32 abilities = 3;
  repeated PlatformMotionNode nodes = 4;
  repeated PlatformMotionEdge edges = 5;
}

message PlatformMotionNode {
  uint32 id = 1;
  uint32 surface = 2;
  uint32 interval = 3;
  double height = 4;
  double footing_lo = 5;
  double footing_hi = 6;
  double velocity_lo = 7;
  double velocity_hi = 8;
  uint32 mode = 9;
}

message PlatformMotionEdge {
  uint32 id = 1;
  uint32 from = 2;
  uint32 to = 3;
  uint32 kind = 4;
  uint32 requires = 5;
  uint32 passage = 6;
  uint32 transition = 7;
  double duration = 8;
}

// PlatformLayout exports the canonical tiles plus the generator judgement.
// A future additive jump-graph message/RPC is required for platform routing:
// ComputeSteps only represents cardinal directions and distances.
message PlatformLayout {
  uint64 seed = 1;
  uint32 width = 2;
  uint32 height = 3;
  repeated PlatformRoom rooms = 4;
  PlatformJudgement judgement = 5;
  PlatformJumpGraph jump_graph = 6;
}

// CostGrid is one entry cost per Cell, row-major. costs is bytes rather than
// a packed repeated uint32: at the 256×256 ceiling one length-delimited block
// is exactly 65,536 payload bytes, always, while a packed repeated uint32
// varint-encodes to as much as 128 KiB and the size depends on the data,
// which a latency budget cannot absorb. bytes also decodes as one slice
// instead of a 256 KiB []uint32 that then needs a narrowing pass. The domain
// is 0..255, which bytes cannot misrepresent and uint32 admits as four
// billion invalid values.
message CostGrid {
  uint32 width = 1;
  uint32 height = 2;
  // costs holds exactly width × height bytes, row-major, the same order as
  // Grid.cells: the cost of (x, y) is costs[y*width+x]. 0 is impassable;
  // 1..255 are entry costs.
  bytes costs = 3;
}

// Source is one goal of a distance field. Its field numbers stay in 1..15 so
// each tag is one byte: Source repeats once per NPC, as Step and Cell do.
message Source {
  Cell at = 1;
  uint32 bias = 2;
}

// Query is one goal set and the positions to answer against it. One call
// carries every query of a turn, so the grid travels once per turn rather
// than once per goal or once per NPC.
message Query {
  repeated Source sources = 1;
  repeated Cell positions = 2;
  bool flee = 3;
  optional sint32 flee_numerator = 4;
  optional uint32 flee_denominator = 5;
}

// ComputeStepsRequest carries a whole turn. Nothing in it is stored after
// the response: no handle, no session and no cache.
message ComputeStepsRequest {
  CostGrid cost_grid = 1;
  repeated Query queries = 2;
}

// Step is the answer for one position. distance is sint32 because it is -1
// on the common unreachable case, and a plain int32 varint encodes -1 in ten
// bytes on a field that repeats once per NPC. Field numbers stay in 1..15,
// as on Source and Cell, so each tag is one byte.
message Step {
  // direction is meaningful only when status is STEP_STATUS_MOVED.
  Direction direction = 1;
  // distance is -1 when the position is unreachable or outside the grid.
  sint32 distance = 2;
  StepStatus status = 3;
}

// QueryResult holds one Step per position of the matching Query, in order.
message QueryResult {
  repeated Step steps = 1;
}

// ComputeStepsResponse returns one QueryResult per Query, in request order.
// No field is retained after the call returns.
message ComputeStepsResponse {
  repeated QueryResult results = 1;
}

// OpacityGrid is one transparency bit per Cell, row-major, packed.
// transparent is bytes rather than a packed repeated bool: the length is
// exactly (width*height+7)/8, one length-delimited block and one allocation,
// and a short or long buffer cannot be a valid grid. A repeated bool would
// be a tag per bit and a size that depends on how many cells are open. The
// stored bit is transparent, so a zero-filled buffer is solid terrain.
message OpacityGrid {
  uint32 width = 1;
  uint32 height = 2;
  // transparent holds exactly (width*height+7)/8 bytes. Bit i is
  // transparent[i>>3] & (1<<(i&7)), with i = y*width+x, least-significant
  // bit first inside each byte. Unused high bits of the final byte are not
  // cells and must be zero, so one terrain has one encoding.
  bytes transparent = 3;
}

// VisibilityQuery is one observer. Field numbers stay in 1..15 so each tag
// is one byte: a query repeats once per observer, as Source and Cell do.
// radius 0 is a real radius, the origin alone. It is a plain uint32, not an
// optional, so zero is that radius rather than an omitted default.
message VisibilityQuery {
  Cell origin = 1;
  uint32 radius = 2;
}

// ComputeVisibilityRequest carries one turn of observers. Nothing in it is
// stored after the response: no handle, no session and no cache. The grid
// travels once per turn rather than once per observer.
message ComputeVisibilityRequest {
  OpacityGrid opacity_grid = 1;
  repeated VisibilityQuery queries = 2;
}

// VisibilityField is the bitset that answers one VisibilityQuery. visible
// uses the same row-major, least-significant-bit-first packing and zero
// padding as OpacityGrid.transparent, and the same exact length. Width and
// height stay on the request: repeating them on every field would multiply
// a constant by the query count.
message VisibilityField {
  bytes visible = 1;
}

// ComputeVisibilityResponse returns one VisibilityField per VisibilityQuery,
// in request order. Field i answers query i. Origins and radii are not
// echoed. Nothing is retained after the call returns.
message ComputeVisibilityResponse {
  repeated VisibilityField fields = 1;
}

// CorridorOrder chooses the preferred elbow of the orthogonal L-shaped route.
// UNSPECIFIED is read as the X_THEN_Y default.
enum CorridorOrder {
  CORRIDOR_ORDER_UNSPECIFIED = 0;
  CORRIDOR_ORDER_X_THEN_Y = 1;
  CORRIDOR_ORDER_Y_THEN_X = 2;
}

// RoomRole is the optional thematic role of a Room.
enum RoomRole {
  ROOM_ROLE_UNSPECIFIED = 0;
  ROOM_ROLE_START = 1;
  ROOM_ROLE_BOSS = 2;
  ROOM_ROLE_TREASURE = 3;
}

// Direction is one of the four cardinal directions of the Grid. Diagonals are
// invalid. The canonical order is NORTH, EAST, SOUTH, WEST.
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_NORTH = 1;
  DIRECTION_EAST = 2;
  DIRECTION_SOUTH = 3;
  DIRECTION_WEST = 4;
}

// CellKind is the physical state of a Grid Cell.
enum CellKind {
  CELL_KIND_UNSPECIFIED = 0;
  CELL_KIND_EMPTY = 1;
  CELL_KIND_ROOM = 2;
  CELL_KIND_CORRIDOR = 3;
}

// RoomShape identifies the canonical geometric mask of a Room.
enum RoomShape {
  ROOM_SHAPE_UNSPECIFIED = 0;
  ROOM_SHAPE_RECTANGLE = 1;
  ROOM_SHAPE_L = 2;
  ROOM_SHAPE_T = 3;
  ROOM_SHAPE_CROSS = 4;
  ROOM_SHAPE_CIRCLE = 5;
}

// StepStatus distinguishes the five outcomes of one position. Moved, arrived,
// unreachable and outside are four results a game needs; a bare Direction
// would force DIRECTION_UNSPECIFIED to mean three of them. BLOCKED is the
// fifth: the goal is reachable but no neighbour is strictly nearer, which is
// the correct answer on a flee field — the position is as safe as this map
// gets and should hold.
enum StepStatus {
  STEP_STATUS_UNSPECIFIED = 0;
  STEP_STATUS_MOVED = 1;
  STEP_STATUS_ARRIVED = 2;
  STEP_STATUS_UNREACHABLE = 3;
  STEP_STATUS_OUTSIDE = 4;
  STEP_STATUS_BLOCKED = 5;
}

// Cell is an integer (x, y) coordinate on the Grid, never a pixel position.
// Valid only inside the Grid: 0 ≤ x < width and 0 ≤ y < height.
message Cell {
  int32 x = 1;
  int32 y = 2;
}

// Config is the complete input of a generation request. width, height and
// seed are required and have no safe defaults; the other absent fields
// receive the SDK defaults (cell_size 1.0, min_distance 6.0, max_attempts 30,
// max_rooms 256, corridor_order X_THEN_Y). v1 product limits: width and
// height in 1..256, width × height ≤ 65,536 and max_rooms ≤ 256; exceeding
// them fails with ResourceExhausted, with no truncation.
message Config {
  uint32 width = 1;
  uint32 height = 2;
  // cell_size is the size of one Cell in opaque caller units, copied onto
  // the Layout only; finite and > 0.
  double cell_size = 3;
  // seed is the source of the request's random streams; zero is valid and
  // does not mean random.
  uint64 seed = 4;
  // min_distance is the minimum Euclidean distance, in Cells, between Room
  // centres; finite and ≥ 1.0.
  double min_distance = 5;
  // max_attempts is the maximum number of Poisson candidates per active
  // point: 1..1024.
  uint32 max_attempts = 6;
  // max_rooms is the maximum number of accepted Rooms: 1..256.
  uint32 max_rooms = 7;
  CorridorOrder corridor_order = 8;
  // extra_edge_count is the maximum number of discarded short edges
  // reintroduced after the backbone; 0 disables cycles and guarantees a tree.
  uint32 extra_edge_count = 9;
  // room_role_requests lists at most one entry per RoomRole; empty disables
  // thematic Rooms.
  repeated RoomRoleRequest room_role_requests = 10;
  // density_regions lists non-empty rectangles, inside the Grid and without
  // overlap; empty uses a uniform min_distance and disables biomes.
  repeated DensityRegion density_regions = 11;
  // plant_catalog is optional; when absent, plant_id and tags stay empty on
  // the Layout.
  PlantCatalog plant_catalog = 12;
  // room_geometry is the optional Room geometry. When absent, each shape
  // uses its dynamic profile: Rectangle, L, T, and Cross are 3..9 and Circle
  // is 5..9, each axis clamped to the Grid. An omitted width or height on a
  // present shape is that same profile for that axis, not a 0..0 range.
  optional RoomGeometry room_geometry = 13;
  // corridor_geometry is the optional Corridor width distribution. When
  // absent, every Corridor is one Cell wide, the same as a nil pointer in Go.
  // A present message must list at least one width and must include width 1;
  // an empty message is not the absent case.
  optional CorridorGeometry corridor_geometry = 14;
  // max_room_edges is the largest number of corridors that may reach one
  // room. Zero means unlimited, and the room's geometry is then the only
  // ceiling. When set it must be at least 2: a spanning tree over n rooms
  // needs n-1 edges, so a ceiling of 1 can connect only two rooms.
  uint32 max_room_edges = 15;
  // terrain is the optional open terrain vocabulary and placement policy.
  optional TerrainConfig terrain = 16;
}

// TerrainDefinition carries the two generic spatial facts Daedalus needs;
// the identifier remains open and caller-defined.
message TerrainDefinition {
  string id = 1;
  // 0 is impassable; 1..255 is the default pathfinding entry cost.
  uint32 entry_cost = 2;
  bool transparent = 3;
}

message TerrainWeight {
  string terrain_id = 1;
  uint32 weight = 2;
}

message TerrainDistribution {
  uint32 none_weight = 1;
  repeated TerrainWeight terrains = 2;
  uint32 min_patch_cells = 3;
  uint32 max_patch_cells = 4;
}

message TerrainConfig {
  repeated TerrainDefinition definitions = 1;
  optional TerrainDistribution rooms = 2;
  optional TerrainDistribution corridors = 3;
}

// RoomGeometry defines the area, spacing and per-shape ranges of Rooms.
// The old shared bounds min_width, max_width, min_height and max_height are
// gone; their field numbers stay reserved so a later field cannot reuse them.
message RoomGeometry {
  reserved 1, 2, 3, 4;
  reserved "min_width", "max_width", "min_height", "max_height";
  // max_footprint_cells limits the Cells occupied by a single Room.
  uint32 max_footprint_cells = 5;
  // min_room_gap is the minimum number of empty layers between footprints,
  // measured by the Chebyshev distance between occupied Cells.
  uint32 min_room_gap = 6;
  // shapes lists positive weights per shape, with no duplicate shapes. Each
  // entry carries that shape's width and height.
  repeated RoomShapeWeight shapes = 7;
}

// DimensionRange is an inclusive Cell span. max of 0, or min greater than
// max, is an empty span. A span the shape cannot realize is invalid. A span
// the Grid cannot hold drops the shape.
message DimensionRange {
  uint32 min = 1;
  uint32 max = 2;
}

// RoomShapeWeight associates a shape with a positive selection weight and
// the width and height spans for that shape. An omitted width or height is
// the dynamic profile for that axis. A present range, including 0..0, is
// validated as written.
message RoomShapeWeight {
  // shape is one of the canonical Room shapes.
  RoomShape shape = 1;
  // weight is the positive relative weight used when selecting the shape.
  uint32 weight = 2;
  // width is the bounding-box width span, in Cells.
  DimensionRange width = 3;
  // height is the bounding-box height span, in Cells.
  DimensionRange height = 4;
}

// CorridorGeometry defines the width distribution for Corridors.
// A present message requires a non-empty widths list. Absence, not an empty
// message, means every Corridor is one Cell wide.
message CorridorGeometry {
  // widths lists positive weights per corridor width, with no duplicate
  // widths. Each width is 1..64 and each weight is 1..2^32-1. The list must
  // include width 1: degradation walks declared widths and nothing else, so
  // without it a Room whose perimeter admits no wider Corridor has no routable
  // edge at all. A list without width 1 is rejected as an invalid config.
  // Declaring it removes that failure, it does not promise a Layout.
  repeated CorridorWidthWeight widths = 1;
}

// CorridorWidthWeight associates a corridor width, in Cells, with a positive
// selection weight.
message CorridorWidthWeight {
  // width is the corridor width in Cells, from 1 to 64 inclusive.
  uint32 width = 1;
  // weight is the positive relative weight used when selecting the width.
  uint32 weight = 2;
}

// RoomRoleRequest is a declarative request to assign one RoomRole and the
// required Plant tags.
message RoomRoleRequest {
  RoomRole role = 1;
  // count is 1 for START and BOSS, and 0..max_rooms for TREASURE. BOSS
  // requires a START request in the same Config.
  uint32 count = 2;
  // required_tags lists non-empty UTF-8 tags with no duplicates.
  repeated string required_tags = 3;
  // max_room_edges is the largest number of corridors that may reach each
  // room assigned this role. Zero means no role-specific ceiling; one is valid.
  uint32 max_room_edges = 4;
}

enum GateKind {
  GATE_KIND_UNSPECIFIED = 0;
  GATE_KIND_MAIN = 1;
  GATE_KIND_OPTIONAL = 2;
}

message GatingRequest {
  uint64 seed = 1;
  uint32 start_room_id = 2;
  optional uint32 target_room_id = 3;
  uint32 main_gate_count = 4;
  uint32 optional_gate_count = 5;
}

message BuildGatingPlanRequest {
  Layout layout = 1;
  GatingRequest request = 2;
}

message Gate {
  uint32 id = 1;
  GateKind kind = 2;
  uint32 door_id = 3;
  uint32 key_room_id = 4;
}

message GatingPlan {
  uint64 seed = 1;
  repeated Gate gates = 2;
}

message BuildGatingPlanResponse {
  GatingPlan plan = 1;
}

// DensityRegion is a Grid rectangle that replaces min_distance with a local
// distance. The rectangle is half-open: min is inclusive and max is
// exclusive, covering x in [min.x, max.x) and y in [min.y, max.y).
message DensityRegion {
  // min is the rectangle's minimum corner, in Cells, inclusive.
  Cell min = 1;
  // max is the rectangle's maximum corner, in Cells, exclusive.
  Cell max = 2;
  // min_distance is the local minimum Euclidean distance, in Cells: finite
  // and ≥ 1.0.
  double min_distance = 3;
}

// PlantCatalog is the engine-agnostic catalogue of asset metadata. When
// present, both lists are non-empty, with unique IDs.
message PlantCatalog {
  repeated RoomPlant rooms = 1;
  repeated CorridorPlant corridors = 2;
}

// RoomPlant describes the metadata of one catalogue Room Plant.
message RoomPlant {
  // id is the opaque asset identifier: non-empty UTF-8.
  string id = 1;
  repeated string tags = 2;
  // weight is the relative weight of the weighted selection: 1..2^32-1.
  uint32 weight = 3;
  // door_directions declares the supported opening Directions: non-empty and
  // with no duplicates.
  repeated Direction door_directions = 4;
}

// CorridorPlant describes the metadata of one catalogue Corridor Plant.
// It declares no local geometry because that geometry derives from
// Corridor.cells.
message CorridorPlant {
  string id = 1;
  repeated string tags = 2;
  uint32 weight = 3;
}

// CellState is the physical state of one generated Grid Cell.
message CellState {
  Cell at = 1;
  CellKind kind = 2;
  // room_id is present if and only if kind == CELL_KIND_ROOM.
  optional uint32 room_id = 3;
  // corridor_ids lists, in ascending order, every Corridor that contains
  // this Cell; non-empty if and only if kind == CELL_KIND_CORRIDOR.
  repeated uint32 corridor_ids = 4;
}

// Grid is the Layout's rectangular space of width × height Cells.
message Grid {
  uint32 width = 1;
  uint32 height = 2;
  // cell_size is the size of one Cell in opaque caller units.
  double cell_size = 3;
  // cells contains exactly width × height states, in canonical order
  // (Y then X): the state of (x, y) is at cells[y * width + x].
  repeated CellState cells = 4;
  // terrain is absent for the historical nil/default Layout.
  optional TerrainLayer terrain = 5;
}

message TerrainLayer {
  // Sorted bytewise by id. Index byte n addresses palette[n-1]; 0 is none.
  repeated TerrainDefinition palette = 1;
  // Exactly grid.width * grid.height bytes, row-major.
  bytes indices = 2;
}

// Room is a topological vertex of the Layout and holds its absolute footprint.
message Room {
  uint32 id = 1;
  Cell at = 2;
  // role is absent when the Config requested no thematic roles, or when no
  // role was assigned to this Room.
  optional RoomRole role = 3;
  // plant_id is the selected asset metadata, or empty when there is no
  // catalogue.
  string plant_id = 4;
  // tags is the canonical copy of the selected Plant's tags.
  repeated string tags = 5;
  // door_ids lists the openings in Cell order (y, x) and Direction.
  repeated uint32 door_ids = 6;
  // shape is the canonical discrete mask of the footprint.
  RoomShape shape = 7;
  // origin is the top-left corner of the bounding box; it may be unoccupied,
  // as with CROSS.
  Cell origin = 8;
  // width is the bounding-box width, in Cells.
  uint32 width = 9;
  // height is the bounding-box height, in Cells.
  uint32 height = 10;
  // cells is the Room's absolute footprint, in Y-then-X order.
  repeated Cell cells = 11;
}

// Corridor is a topological edge between two Rooms. cells is the occupied
// band; centerline is the ordered route.
message Corridor {
  uint32 id = 1;
  uint32 from_room_id = 2;
  uint32 to_room_id = 3;
  uint32 from_door_id = 4;
  uint32 to_door_id = 5;
  // cells is the occupied band in row-major order (Y then X). At width 1 the
  // band is the route itself, so cells equals centerline. Empty when the
  // Rooms are adjacent.
  repeated Cell cells = 6;
  string plant_id = 7;
  repeated string tags = 8;
  // centerline is the ordered route from the From side to the To side,
  // excluding the endpoint Rooms. It is 4-connected and empty when the Rooms
  // are adjacent. It is recorded at every routed width.
  repeated Cell centerline = 9;
}

// Door is a Room's logical opening, identified by Cell and Direction; unique
// per (room_id, at, direction).
message Door {
  uint32 id = 1;
  uint32 room_id = 2;
  // at is a border Cell that belongs to the owning Room's footprint. With
  // span 1 it is the opening Cell. With a wider span it is the Cell of the
  // span with the smallest (y, x).
  Cell at = 3;
  Direction direction = 4;
  // corridor_ids lists, in ascending order, one or more edges that use this
  // opening.
  repeated uint32 corridor_ids = 5;
  // span is the number of boundary Cells in this opening and is never zero:
  // a one-Cell doorway spans 1. It equals the width the Corridor was routed
  // at, which is 1 when corridor_geometry was absent.
  uint32 span = 6;
}

// Layout is the complete, immutable result of a request that was generated
// successfully. The payload is array-of-structs (AoS): repeated nested
// messages mirror Room, Corridor, Door and CellState, because one moderate
// Layout per request does not justify validating SoA offsets.
message Layout {
  uint64 seed = 1;
  Grid grid = 2;
  repeated Room rooms = 3;
  repeated Corridor corridors = 4;
  repeated Door doors = 5;
}
